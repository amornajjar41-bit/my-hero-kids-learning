kind = "mobile"
previewPath = "/"
title = "Adam – Kids Learning"
version = "1.0.0"
id = "artifacts/adam"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24421

[services.development]
run = "pnpm --filter @workspace/adam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adam", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/adam", "run", "serve" ]

[services.env]
PORT = "24421"
BASE_PATH = "/"
