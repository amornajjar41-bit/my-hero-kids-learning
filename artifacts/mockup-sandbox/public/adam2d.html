<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Adam – 2D Animated Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --blue: #2563eb;
  --yellow: #fbbf24;
  --red: #ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Nunito',sans-serif;
  background:radial-gradient(ellipse 120% 80% at 50% 0%, #1a1060 0%, #060918 60%);
}

/* ── STAGE ── */
#stage{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;
  overflow:hidden;
}

/* ── GLOW UNDER CHARACTER ── */
#glow{
  position:absolute;
  bottom:160px;
  width:220px;height:40px;
  background:radial-gradient(ellipse, #2563eb66 0%, transparent 70%);
  border-radius:50%;
  filter:blur(6px);
  transition:opacity .4s;
}

/* ── CHARACTER WRAPPER ── */
#char-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:10px;
}

/* ── ADAM IMAGE ── */
#adam{
  width:220px;
  image-rendering:-webkit-optimize-contrast;
  filter:drop-shadow(0 8px 24px #2563eb55) drop-shadow(0 2px 6px #0008);
  transition:filter .3s;
  animation: idle-bob 2.8s ease-in-out infinite;
  transform-origin: bottom center;
  position:relative;
  z-index:2;
}

/* ── LIP OVERLAY ── */
#lip{
  position:absolute;
  bottom:112px;
  left:50%;transform:translateX(-50%);
  width:28px;height:10px;
  background:#e8775a;
  border-radius:0 0 20px 20px;
  transform-origin:top center;
  opacity:0;
  z-index:3;
  transition:opacity .2s;
}
#lip.talking{
  opacity:1;
  animation:lip-sync .18s ease-in-out infinite alternate;
}

/* ── THOUGHT BUBBLE ── */
#thought{
  position:absolute;
  top:-90px;right:-60px;
  opacity:0;
  pointer-events:none;
  z-index:10;
  transition:opacity .4s;
}
#thought.show{ opacity:1; }

.bubble-main{
  background:#fff;
  border-radius:50%;
  width:90px;height:75px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  box-shadow:0 4px 16px #0004;
  animation:thought-float 2s ease-in-out infinite;
}
.bubble-dot{
  position:absolute;
  background:#fff;
  border-radius:50%;
  box-shadow:0 2px 8px #0003;
}
.bubble-dot.d1{ width:18px;height:18px; bottom:-8px; right:30px; animation:thought-float 2s ease-in-out infinite .1s; }
.bubble-dot.d2{ width:11px;height:11px; bottom:-22px; right:20px; animation:thought-float 2s ease-in-out infinite .2s; }
.bubble-dot.d3{ width:7px;height:7px; bottom:-32px; right:13px; animation:thought-float 2s ease-in-out infinite .3s; }

/* ── SPARKLES (high five / celebrate) ── */
#sparkles{
  position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:280px;height:100%;
  pointer-events:none;
  z-index:5;
  overflow:visible;
}
.spark{
  position:absolute;
  border-radius:50%;
  opacity:0;
  animation:none;
}

/* ── SPEECH BUBBLE ── */
#speech{
  position:absolute;
  top:-70px;left:-80px;
  background:#fff;
  border-radius:20px;
  padding:10px 14px;
  font-size:13px;font-weight:800;color:#1e1e40;
  box-shadow:0 4px 16px #0004;
  max-width:160px;line-height:1.4;
  opacity:0;
  pointer-events:none;
  z-index:10;
  transition:opacity .3s;
}
#speech::after{
  content:'';
  position:absolute;
  bottom:-10px;right:30px;
  border:10px solid transparent;
  border-top-color:#fff;
  border-bottom:0;margin-left:-10px;
}
#speech.show{ opacity:1; }

/* ── HIGH FIVE ARM ── */
#hifi-arm{
  position:absolute;
  right:-55px;bottom:80px;
  font-size:44px;
  opacity:0;
  transform:rotate(30deg) translateX(20px);
  transition:opacity .3s, transform .3s;
  z-index:4;
}
#hifi-arm.show{
  opacity:1;
  transform:rotate(-10deg) translateX(0px);
  animation:arm-wave 0.4s ease-out;
}

/* ── BUTTONS ── */
#controls{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;padding:12px 16px 16px;
  background:linear-gradient(transparent,#060918ee);
  z-index:20;
}
.btn{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,0.2);
  color:#fff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;
  letter-spacing:.4px;
  padding:7px 14px;border-radius:999px;
  cursor:pointer;
  transition:background .15s,transform .1s,border-color .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(0.95)}
.btn.active{background:var(--blue);border-color:var(--blue)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#000}

/* ── LABEL ── */
#label{
  position:fixed;top:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0 0;
  pointer-events:none;z-index:10;
}
#badge{
  background:linear-gradient(90deg,#2563eb,#7c3aed);
  color:#fff;font-size:12px;font-weight:800;letter-spacing:1.5px;
  padding:5px 18px;border-radius:999px;
  box-shadow:0 2px 12px #2563eb88;
}
#state-label{
  margin-top:6px;
  color:#aac;font-size:12px;font-weight:700;
  min-height:18px;letter-spacing:.4px;
}

/* ── KEYFRAMES ── */
@keyframes idle-bob{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  30%{ transform:translateY(-7px) rotate(.6deg); }
  70%{ transform:translateY(-4px) rotate(-.4deg); }
}
@keyframes think-bob{
  0%,100%{ transform:translateY(0) rotate(-2deg); }
  50%{ transform:translateY(-5px) rotate(2deg); }
}
@keyframes talk-bounce{
  0%,100%{ transform:translateY(0) scaleY(1); }
  25%{ transform:translateY(-4px) scaleY(1.02); }
  75%{ transform:translateY(-2px) scaleY(.99); }
}
@keyframes celebrate-jump{
  0%,100%{ transform:translateY(0) rotate(0); }
  20%{ transform:translateY(-18px) rotate(-3deg); }
  40%{ transform:translateY(0) rotate(3deg); }
  60%{ transform:translateY(-12px) rotate(-2deg); }
  80%{ transform:translateY(0) rotate(1deg); }
}
@keyframes hifi-bounce{
  0%  { transform:translateY(0) rotate(-5deg) scaleX(-1); }
  30% { transform:translateY(-20px) rotate(-8deg) scaleX(-1); }
  50% { transform:translateY(-10px) rotate(-3deg) scaleX(-1); }
  70% { transform:translateY(-16px) rotate(-6deg) scaleX(-1); }
  100%{ transform:translateY(0) rotate(-5deg) scaleX(-1); }
}
@keyframes lip-sync{
  from{ transform:translateX(-50%) scaleY(0.4) scaleX(0.9); }
  to  { transform:translateX(-50%) scaleY(1.0) scaleX(1.1); }
}
@keyframes thought-float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-5px); }
}
@keyframes arm-wave{
  0%  { transform:rotate(30deg) translateX(20px); }
  40% { transform:rotate(-20deg) translateX(-5px); }
  70% { transform:rotate(-5deg) translateX(0); }
  100%{ transform:rotate(-10deg) translateX(0); }
}
@keyframes spark-burst{
  0%  { opacity:1; transform:translate(var(--tx0),var(--ty0)) scale(1); }
  100%{ opacity:0; transform:translate(var(--tx1),var(--ty1)) scale(0); }
}
@keyframes wave-hand{
  0%,100%{ transform:rotate(-5deg) scaleX(-1); }
  25%{ transform:rotate(-25deg) scaleX(-1); }
  75%{ transform:rotate(10deg) scaleX(-1); }
}
@keyframes sleeping{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(3px) rotate(1deg); }
}
</style>
</head>
<body>

<div id="label">
  <div id="badge">⚡ ADAM — ANIMATED 2D PREVIEW</div>
  <div id="state-label">Idle</div>
</div>

<div id="stage">
  <div id="glow"></div>
  <div id="char-wrap">
    <div id="thought">
      <div class="bubble-dot d3"></div>
      <div class="bubble-dot d2"></div>
      <div class="bubble-dot d1"></div>
      <div class="bubble-main">🤔</div>
    </div>
    <div id="speech">High five! ⚡</div>
    <div id="hifi-arm">🤚</div>
    <img id="adam" src="adam-transparent.png" alt="Adam"/>
    <div id="lip"></div>
    <div id="sparkles"></div>
  </div>
</div>

<div id="controls">
  <button class="btn active" onclick="setState('idle')">😊 Idle</button>
  <button class="btn" onclick="setState('think')">🤔 Thinking</button>
  <button class="btn" onclick="setState('talk')">💬 Talking</button>
  <button class="btn" onclick="setState('hifi')">🙌 High Five</button>
  <button class="btn" onclick="setState('celebrate')">🎉 Celebrate</button>
  <button class="btn" onclick="setState('wave')">👋 Wave</button>
  <button class="btn yellow" onclick="autoDemo()">▶ Auto Demo</button>
</div>

<script>
const adam   = document.getElementById('adam');
const lip    = document.getElementById('lip');
const thought= document.getElementById('thought');
const speech = document.getElementById('speech');
const hifiArm= document.getElementById('hifi-arm');
const sparks = document.getElementById('sparkles');
const stateLabel = document.getElementById('state-label');
const glow   = document.getElementById('glow');

let current = 'idle';
let demoTimer = null;

const STATES = {
  idle:      { label:'Idle — gentle floating',  anim:'idle-bob 2.8s ease-in-out infinite',   lip:false, thought:false, speech:false, hifi:false, celebrate:false, wave:false },
  think:     { label:'Thinking…',               anim:'think-bob 2.2s ease-in-out infinite',  lip:false, thought:true,  speech:false, hifi:false, celebrate:false, wave:false },
  talk:      { label:'Talking — lip sync',      anim:'talk-bounce .45s ease-in-out infinite',lip:true,  thought:false, speech:false, hifi:false, celebrate:false, wave:false },
  hifi:      { label:'High Five! ⚡',            anim:'hifi-bounce 1.8s ease-in-out infinite',lip:false, thought:false, speech:true,  hifi:true,  celebrate:false, wave:false },
  celebrate: { label:'Celebrate! 🎉',           anim:'celebrate-jump 1.0s ease-in-out infinite',lip:false,thought:false,speech:false, hifi:false, celebrate:true,  wave:false },
  wave:      { label:'Waving 👋',               anim:'wave-hand 1.1s ease-in-out infinite',  lip:false, thought:false, speech:false, hifi:false, celebrate:false, wave:true  },
};

function clearSparks(){
  sparks.innerHTML='';
}

function burstSparks(count=10){
  clearSparks();
  const colors=['#fbbf24','#f472b6','#60a5fa','#34d399','#f87171','#fff'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='spark';
    const size=6+Math.random()*10;
    const angle=Math.random()*Math.PI*2;
    const dist=60+Math.random()*80;
    const tx0=Math.cos(angle)*5+'px';
    const ty0=Math.sin(angle)*5+'px';
    const tx1=Math.cos(angle)*dist+'px';
    const ty1=Math.sin(angle)*dist+'px';
    el.style.cssText=`
      width:${size}px;height:${size}px;
      background:${colors[i%colors.length]};
      left:${90+Math.random()*100}px;
      top:${40+Math.random()*120}px;
      --tx0:${tx0};--ty0:${ty0};
      --tx1:${tx1};--ty1:${ty1};
      animation:spark-burst ${.5+Math.random()*.6}s ease-out ${Math.random()*.2}s forwards;
    `;
    sparks.appendChild(el);
  }
}

function setState(name){
  current = name;
  const s = STATES[name];

  // Update label
  stateLabel.textContent = s.label;

  // Update buttons
  document.querySelectorAll('.btn:not(.yellow)').forEach(b=>b.classList.remove('active'));
  const btns = [...document.querySelectorAll('.btn:not(.yellow)')];
  const keys = ['idle','think','talk','hifi','celebrate','wave'];
  btns[keys.indexOf(name)]?.classList.add('active');

  // Apply animation
  adam.style.animation = 'none';
  adam.offsetHeight; // force reflow
  adam.style.animation = s.anim;

  // Lip sync
  lip.className = s.lip ? 'talking' : '';

  // Thought bubble
  thought.className = s.thought ? 'show' : '';

  // Speech bubble
  speech.className = s.speech ? 'show' : '';

  // High five arm
  if(s.hifi){
    hifiArm.className='';
    hifiArm.offsetHeight;
    hifiArm.className='show';
  } else {
    hifiArm.className='';
  }

  // Sparkles
  if(s.celebrate){
    burstSparks(14);
    const sparkLoop = setInterval(()=>{
      if(current==='celebrate') burstSparks(8);
      else clearInterval(sparkLoop);
    }, 900);
  } else if(s.hifi){
    burstSparks(8);
  } else {
    clearSparks();
  }

  // Glow color
  glow.style.background = name==='celebrate'
    ? 'radial-gradient(ellipse,#f472b688 0%,transparent 70%)'
    : name==='hifi'
    ? 'radial-gradient(ellipse,#fbbf2488 0%,transparent 70%)'
    : 'radial-gradient(ellipse,#2563eb66 0%,transparent 70%)';

  // Drop shadow
  adam.style.filter = name==='celebrate'
    ? 'drop-shadow(0 8px 32px #f472b688) drop-shadow(0 2px 8px #0008)'
    : name==='hifi'
    ? 'drop-shadow(0 8px 28px #fbbf2488) drop-shadow(0 2px 8px #0008)'
    : name==='think'
    ? 'drop-shadow(0 8px 24px #60a5fa66) drop-shadow(0 2px 6px #0008)'
    : 'drop-shadow(0 8px 24px #2563eb55) drop-shadow(0 2px 6px #0008)';
}

function autoDemo(){
  clearTimeout(demoTimer);
  const seq = [
    ['idle',1800],
    ['think',2400],
    ['talk',2000],
    ['hifi',2200],
    ['celebrate',2500],
    ['wave',1800],
    ['idle',0],
  ];
  let i=0;
  function next(){
    setState(seq[i][0]);
    if(i<seq.length-1){
      demoTimer=setTimeout(()=>{ i++; next(); }, seq[i][1]);
    }
  }
  next();
}

// Start
setState('idle');

// Auto-run demo on load after short delay
setTimeout(autoDemo, 800);
</script>
</body>
</html>
