<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Adam – 2D Animated Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --blue: #2563eb;
  --yellow: #fbbf24;
  --red: #ef4444;
  --display-w: 220px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Nunito',sans-serif;
  background:radial-gradient(ellipse 120% 80% at 50% 0%, #1a1060 0%, #060918 60%);
}

/* ── STAGE ── */
#stage{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;
}

/* ── GLOW UNDER CHARACTER ── */
#glow{
  position:absolute;
  bottom:156px;
  width:200px;height:36px;
  background:radial-gradient(ellipse,#2563eb55 0%,transparent 70%);
  border-radius:50%;
  filter:blur(8px);
}

/* ── CHARACTER WRAPPER ── */
#char-wrap{
  position:relative;
  width:var(--display-w);
}

/* ── ADAM IMAGE ── */
#adam{
  display:block;
  width:var(--display-w);
  height:var(--display-w);
  filter:drop-shadow(0 10px 28px #2563eb44) drop-shadow(0 2px 8px #0009);
  animation: idle-bob 2.8s ease-in-out infinite;
  transform-origin:bottom center;
}

/* ═══════════════════════════════════════════
   BLINK EYELIDS
   Image is 1024×1024 displayed at 220×220px.
   Eyes are approx at 30% from top = 66px.
   Left eye center X ≈ 37% = 81px
   Right eye center X ≈ 62% = 136px
   Lid oval: 26px wide, 22px tall
═══════════════════════════════════════════ */
.blink-lid{
  position:absolute;
  width:26px; height:22px;
  border-radius:50%;
  /* Match the blue mask color exactly */
  background:#2460df;
  transform:scaleY(0);
  transform-origin:top center;
  z-index:6;
  pointer-events:none;
}
#lid-L{ left:68px;  top:62px; }
#lid-R{ left:123px; top:62px; }

/* ═══════════════════════════════════════════
   THOUGHT BUBBLE
   Flows upward FROM head: small dot → medium → large → bubble
   Positioned above adam's head (top of 220px image ≈ y=0 in char-wrap)
═══════════════════════════════════════════ */
#thought{
  position:absolute;
  /* align right-of-center above head */
  bottom:calc(var(--display-w) - 10px);
  left:58%;
  display:flex;
  flex-direction:column-reverse; /* dots at bottom (near head), bubble at top */
  align-items:flex-start;
  gap:5px;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s;
}
#thought.show{ opacity:1; }

/* Bubble grows upward from connecting dots */
.bubble-main{
  background:#fff;
  border-radius:50%;
  width:80px; height:68px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  box-shadow:0 4px 18px #0003;
  animation:thought-sway 3s ease-in-out infinite;
  flex-shrink:0;
}
/* Connector dots — small at bottom (near head), larger toward bubble */
.bubble-dot{
  background:#fff;
  border-radius:50%;
  flex-shrink:0;
  box-shadow:0 2px 6px #0002;
  animation:thought-sway 3s ease-in-out infinite;
}
.bubble-dot.d3{ width:7px;  height:7px;  animation-delay:.06s; }
.bubble-dot.d2{ width:12px; height:12px; animation-delay:.03s; }
.bubble-dot.d1{ width:18px; height:18px; animation-delay:.0s; }

/* ── SPEECH BUBBLE ── */
#speech{
  position:absolute;
  top:-68px; left:-90px;
  background:#fff;
  border-radius:18px;
  padding:9px 13px;
  font-size:13px;font-weight:800;color:#1e1e40;
  box-shadow:0 4px 16px #0003;
  max-width:150px;line-height:1.4;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
#speech::after{
  content:'';
  position:absolute;
  bottom:-9px;right:28px;
  border:9px solid transparent;
  border-top-color:#fff;border-bottom:0;
}
#speech.show{ opacity:1; }

/* ── HIGH FIVE ARM ── */
#hifi-arm{
  position:absolute;
  right:-52px; bottom:72px;
  font-size:42px;
  opacity:0;
  transform:rotate(30deg) translateX(20px);
  transition:opacity .25s,transform .3s;
}
#hifi-arm.show{
  opacity:1;
  animation:arm-wave .45s ease-out forwards;
}

/* ── SPARKLES ── */
#sparkles{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:visible;
  z-index:5;
}
.spark{
  position:absolute;
  border-radius:50%;
  opacity:0;
}

/* ─────────────────────────── BUTTONS ── */
#controls{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;padding:10px 14px 14px;
  background:linear-gradient(transparent,#060918ee);
  z-index:20;
}
.btn{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,0.2);
  color:#fff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;
  letter-spacing:.4px;
  padding:7px 13px;border-radius:999px;
  cursor:pointer;user-select:none;
  transition:background .15s,transform .1s;
  white-space:nowrap;
}
.btn:active{transform:scale(.95)}
.btn.active{background:var(--blue);border-color:var(--blue)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#000}

/* ─────────────────────── LABEL ── */
#label{
  position:fixed;top:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0 0;
  pointer-events:none;z-index:10;
}
#badge{
  background:linear-gradient(90deg,#2563eb,#7c3aed);
  color:#fff;font-size:12px;font-weight:800;letter-spacing:1.5px;
  padding:5px 18px;border-radius:999px;
  box-shadow:0 2px 12px #2563eb88;
}
#state-label{
  margin-top:6px;color:#aac;font-size:12px;font-weight:700;
  min-height:18px;letter-spacing:.4px;
}

/* ─────────────────────── KEYFRAMES ── */
@keyframes idle-bob{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  35%{ transform:translateY(-8px) rotate(.5deg); }
  70%{ transform:translateY(-4px) rotate(-.4deg); }
}
@keyframes think-bob{
  0%,100%{ transform:translateY(0) rotate(-1.5deg); }
  50%{ transform:translateY(-6px) rotate(1.8deg); }
}
@keyframes celebrate-jump{
  0%,100%{ transform:translateY(0) rotate(0); }
  20%{ transform:translateY(-20px) rotate(-3deg); }
  40%{ transform:translateY(0) rotate(3deg); }
  60%{ transform:translateY(-13px) rotate(-2deg); }
  80%{ transform:translateY(0) rotate(1deg); }
}
@keyframes wave-hand{
  0%,100%{ transform:translateY(0) rotate(0); }
  25%{ transform:translateY(-5px) rotate(-4deg); }
  75%{ transform:translateY(-2px) rotate(3deg); }
}
@keyframes hifi-bounce{
  0%,100%{ transform:translateY(0) rotate(-4deg); }
  30%{ transform:translateY(-22px) rotate(-8deg); }
  55%{ transform:translateY(-10px) rotate(-2deg); }
  75%{ transform:translateY(-16px) rotate(-6deg); }
}
@keyframes arm-wave{
  0%  { transform:rotate(30deg) translateX(18px); }
  35% { transform:rotate(-18deg) translateX(-4px); }
  65% { transform:rotate(-4deg) translateX(0); }
  100%{ transform:rotate(-10deg) translateX(0); }
}
@keyframes thought-sway{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-5px); }
}
@keyframes blink-close{
  0%  { transform:scaleY(0); }
  100%{ transform:scaleY(1); }
}
@keyframes blink-open{
  0%  { transform:scaleY(1); }
  100%{ transform:scaleY(0); }
}
@keyframes spark-burst{
  0%  { opacity:1; transform:translate(var(--tx0),var(--ty0)) scale(1); }
  100%{ opacity:0; transform:translate(var(--tx1),var(--ty1)) scale(0); }
}
</style>
</head>
<body>

<div id="label">
  <div id="badge">⚡ ADAM — ANIMATED 2D PREVIEW</div>
  <div id="state-label">Idle</div>
</div>

<div id="stage">
  <div id="glow"></div>
  <div id="char-wrap">

    <!-- THOUGHT BUBBLE: col-reverse so d3(small) is at bottom near head, bubble at top -->
    <div id="thought">
      <div class="bubble-main">🤔</div>
      <div class="bubble-dot d1"></div>
      <div class="bubble-dot d2"></div>
      <div class="bubble-dot d3"></div>
    </div>

    <!-- SPEECH BUBBLE -->
    <div id="speech">High five! ⚡</div>

    <!-- HIGH FIVE ARM -->
    <div id="hifi-arm">🤚</div>

    <!-- ADAM IMAGE -->
    <img id="adam" src="adam-transparent.png" alt="Adam"/>

    <!-- BLINK EYELIDS — positioned over Adam's eyes in the 220×220 rendered area -->
    <div class="blink-lid" id="lid-L"></div>
    <div class="blink-lid" id="lid-R"></div>

    <!-- SPARKLES -->
    <div id="sparkles"></div>

  </div>
</div>

<div id="controls">
  <button class="btn active" onclick="setState('idle')">😊 Idle</button>
  <button class="btn" onclick="setState('think')">🤔 Thinking</button>
  <button class="btn" onclick="setState('hifi')">🙌 High Five</button>
  <button class="btn" onclick="setState('celebrate')">🎉 Celebrate</button>
  <button class="btn" onclick="setState('wave')">👋 Wave</button>
  <button class="btn yellow" onclick="autoDemo()">▶ Auto Demo</button>
</div>

<script>
const adam     = document.getElementById('adam');
const thought  = document.getElementById('thought');
const speech   = document.getElementById('speech');
const hifiArm  = document.getElementById('hifi-arm');
const sparkEl  = document.getElementById('sparkles');
const lidL     = document.getElementById('lid-L');
const lidR     = document.getElementById('lid-R');
const stateLabel = document.getElementById('state-label');
const glow     = document.getElementById('glow');

let current   = 'idle';
let blinkTimer = null;
let demoTimer  = null;

/* ═══ BLINK ENGINE ═══
   Natural human blink: eyes close ~100ms, pause ~30ms, open ~80ms
   Interval: every 3–6s randomly
*/
function doBlink(){
  const DUR_CLOSE = 100; // ms
  const DUR_PAUSE = 40;
  const DUR_OPEN  = 90;

  [lidL, lidR].forEach(lid => {
    lid.style.transition = `transform ${DUR_CLOSE}ms ease-in`;
    lid.style.transform  = 'scaleY(1)';
  });

  setTimeout(()=>{
    [lidL, lidR].forEach(lid => {
      lid.style.transition = `transform ${DUR_OPEN}ms ease-out`;
      lid.style.transform  = 'scaleY(0)';
    });
  }, DUR_CLOSE + DUR_PAUSE);
}

function startBlink(){
  stopBlink();
  function scheduleBlink(){
    const delay = 3000 + Math.random() * 3500; // 3–6.5s
    blinkTimer = setTimeout(()=>{
      doBlink();
      scheduleBlink();
    }, delay);
  }
  // First blink after 1.5s
  blinkTimer = setTimeout(()=>{ doBlink(); scheduleBlink(); }, 1500);
}

function stopBlink(){
  clearTimeout(blinkTimer);
  [lidL, lidR].forEach(lid => {
    lid.style.transition = '';
    lid.style.transform  = 'scaleY(0)';
  });
}

/* ═══ SPARKLES ═══ */
function clearSparks(){ sparkEl.innerHTML=''; }

function burstSparks(count=10){
  clearSparks();
  const colors=['#fbbf24','#f472b6','#60a5fa','#34d399','#f87171','#fff','#a78bfa'];
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'spark';
    const size  = 6 + Math.random()*10;
    const angle = Math.random()*Math.PI*2;
    const dist  = 55 + Math.random()*75;
    el.style.cssText = `
      width:${size}px;height:${size}px;
      background:${colors[i%colors.length]};
      left:${50 + Math.cos(angle)*10}px;
      top:${90 + Math.sin(angle)*10}px;
      --tx0:${Math.cos(angle)*8}px;
      --ty0:${Math.sin(angle)*8}px;
      --tx1:${Math.cos(angle)*dist}px;
      --ty1:${Math.sin(angle)*dist}px;
      animation:spark-burst ${.5+Math.random()*.5}s ease-out ${Math.random()*.15}s forwards;
    `;
    sparkEl.appendChild(el);
  }
}

/* ═══ GLOW ═══ */
function setGlow(name){
  const map = {
    idle:      '#2563eb55',
    think:     '#60a5fa44',
    hifi:      '#fbbf2466',
    celebrate: '#f472b666',
    wave:      '#34d39944',
  };
  glow.style.background = `radial-gradient(ellipse,${map[name]||'#2563eb44'} 0%,transparent 70%)`;
}

/* ═══ DROP SHADOW ═══ */
function setShadow(name){
  const map = {
    idle:      'drop-shadow(0 10px 28px #2563eb44) drop-shadow(0 2px 8px #0009)',
    think:     'drop-shadow(0 10px 28px #60a5fa55) drop-shadow(0 2px 8px #0009)',
    hifi:      'drop-shadow(0 10px 28px #fbbf2466) drop-shadow(0 2px 8px #0009)',
    celebrate: 'drop-shadow(0 10px 32px #f472b677) drop-shadow(0 2px 8px #0009)',
    wave:      'drop-shadow(0 10px 28px #34d39944) drop-shadow(0 2px 8px #0009)',
  };
  adam.style.filter = map[name] || map.idle;
}

/* ═══ SET STATE ═══ */
const ANIMS = {
  idle:      'idle-bob 2.8s ease-in-out infinite',
  think:     'think-bob 2.2s ease-in-out infinite',
  hifi:      'hifi-bounce 1.8s ease-in-out infinite',
  celebrate: 'celebrate-jump 1.0s ease-in-out infinite',
  wave:      'wave-hand 1.4s ease-in-out infinite',
};
const LABELS = {
  idle:      'Idle — floating',
  think:     'Thinking…',
  hifi:      'High Five! ⚡',
  celebrate: 'Celebrate! 🎉',
  wave:      'Waving 👋',
};

let sparkLoop = null;

function setState(name){
  current = name;
  stateLabel.textContent = LABELS[name] || name;

  // Update button highlights
  document.querySelectorAll('.btn:not(.yellow)').forEach((b,i)=>{
    b.classList.toggle('active', ['idle','think','hifi','celebrate','wave'][i] === name);
  });

  // Restart animation
  adam.style.animation = 'none';
  adam.offsetHeight;
  adam.style.animation = ANIMS[name] || ANIMS.idle;

  // Thought bubble
  thought.classList.toggle('show', name === 'think');

  // Speech bubble
  speech.classList.toggle('show', name === 'hifi');

  // High five arm
  if(name === 'hifi'){
    hifiArm.className = '';
    hifiArm.offsetHeight;
    hifiArm.className = 'show';
    burstSparks(8);
  } else {
    hifiArm.className = '';
  }

  // Sparkles
  clearInterval(sparkLoop);
  if(name === 'celebrate'){
    burstSparks(14);
    sparkLoop = setInterval(()=>{ if(current==='celebrate') burstSparks(9); }, 950);
  } else if(name !== 'hifi'){
    clearSparks();
  }

  // Glow + shadow
  setGlow(name);
  setShadow(name);

  // Blink runs always
  startBlink();
}

/* ═══ AUTO DEMO ═══ */
function autoDemo(){
  clearTimeout(demoTimer);
  const seq = [
    ['idle',1800],['think',2500],['wave',1600],
    ['hifi',2000],['celebrate',2200],['idle',0],
  ];
  let i=0;
  function next(){
    setState(seq[i][0]);
    if(i<seq.length-1){
      demoTimer = setTimeout(()=>{ i++; next(); }, seq[i][1]);
    }
  }
  next();
}

// Boot
setState('idle');
setTimeout(autoDemo, 1000);
</script>
</body>
</html>
